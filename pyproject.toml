[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "liebracket"
version = "0.1.0"
description = "Exact Lie algebra and representation-theory numerics: structure constants, Killing forms, root systems, highest weights, BCH."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["lie algebra", "representation theory", "root system", "cartan matrix", "baker-campbell-hausdorff", "geometric deep learning"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
liebracket = "liebracket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liebracket = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
